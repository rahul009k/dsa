<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Prep</title>
<style>
:root{
  --bg:#0b0b12;--surface:#12121b;--surface2:#1a1a26;--surface3:#232333;
  --border:#2a2a3c;--border2:#3b3b52;--text:#e8e8f2;--text2:#9a9ab2;--text3:#62627a;
  --green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--accent:#6366f1;
  --mono:ui-monospace,'JetBrains Mono',Consolas,monospace;--sans:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
button{font-family:inherit}
.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:1.25rem .75rem;z-index:50;transition:transform .25s}
.logo{padding:0 .5rem 1rem;border-bottom:1px solid var(--border);margin-bottom:.75rem}
.logo b{font-family:var(--mono);color:var(--accent);letter-spacing:2px;font-size:15px}
.logo small{display:block;color:var(--text3);font-family:var(--mono);font-size:11px;margin-top:3px}
.nav-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);font-family:var(--mono);padding:.7rem .5rem .3rem}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:#6366f122;color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nav-item span.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item span.c{font-family:var(--mono);font-size:10px;color:var(--text3)}
.main{margin-left:250px;padding:2rem;max-width:1100px}
.menu-btn{display:none;position:fixed;top:10px;left:10px;z-index:60;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:6px 11px;font-size:16px;cursor:pointer}
h1{font-size:22px}.sub{font-size:12px;color:var(--text3);font-family:var(--mono);margin:4px 0 1.5rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.25rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:1.25rem}
.grid4 .card{margin:0}
.num{font-size:28px;font-weight:700;font-family:var(--mono)}
.lbl{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.hint{font-size:12px;color:var(--text2);margin-top:6px;font-family:var(--mono)}
.bar{background:var(--surface3);border-radius:99px;height:8px;overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .4s}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.h3{font-size:13px;font-weight:600}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem;cursor:pointer}
.tcard:hover{border-color:var(--border2)}
.tcard .n{font-size:13px;color:var(--text2);margin-bottom:8px}
.tcard .bar{height:4px}.tcard .bar>div{background:var(--c)}
.tcard .m{font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:6px}
.toolbar{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
.chip{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-family:var(--mono);cursor:pointer}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.on{background:#6366f122;border-color:var(--accent);color:var(--accent)}
.sep{width:1px;height:20px;background:var(--border)}
.search{flex:1;min-width:160px;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--mono);outline:none}
.search:focus{border-color:var(--accent)}
.pattern{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);font-family:var(--mono);margin:1.4rem 0 8px;display:flex;align-items:center;gap:8px}
.pattern::after{content:'';flex:1;height:1px;background:var(--border)}
.prob{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
.prob:hover{border-color:var(--border2)}
.prob.solved .pname{color:var(--text3);text-decoration:line-through}
.prow{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.cb{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;flex-shrink:0;background:none}
.cb:hover{border-color:var(--green)}.cb.on{background:var(--green);border-color:var(--green);color:#fff}
.pbody{flex:1;min-width:180px}
.pname{font-size:13px;font-weight:500}
.plink{font-size:11px;color:var(--blue);text-decoration:none;font-family:var(--mono)}
.plink:hover{text-decoration:underline}
.diff{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:99px;border:1px solid}
.diff.E{color:var(--green);border-color:#22c55e55}.diff.M{color:var(--amber);border-color:#f59e0b55}.diff.H{color:var(--red);border-color:#ef444455}
.acts{display:flex;align-items:center;gap:6px}
.mini{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:3px 8px;font-size:11px;font-family:var(--mono);cursor:pointer}
.mini:hover{color:var(--text);border-color:var(--border2)}
.mini.warn{color:var(--amber);border-color:#f59e0b66}
.note{display:none;padding:0 14px 12px 46px}.note.open{display:block}
.note textarea{width:100%;min-height:80px;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font:12px/1.6 var(--mono);resize:vertical;outline:none}
.note textarea:focus{border-color:var(--accent)}
.empty{text-align:center;padding:3rem;color:var(--text3);font-family:var(--mono);font-size:13px}
.due{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.due:last-child{border:none}
.pill{font-size:11px;font-family:var(--mono);color:var(--text3)}
input[type=number]{width:60px;padding:5px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono)}
@media(max-width:800px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .menu-btn{display:block}.main{margin-left:0;padding:3.5rem 1rem 1.5rem}
  .grid4{grid-template-columns:repeat(2,1fr)}.topics{grid-template-columns:1fr}
}
</style>
</head>
<body>
<button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<nav class="sidebar" id="sidebar"></nav>
<main class="main" id="main"></main>

<script src="data.js"></script>
<script>
// ───────── state ─────────
const KEY = 'dsa_prep_v1';
let S = load();            // { p: {slug:{solved,date,retries,note,star,stage,due}}, goal }
let page = 'dashboard', fStatus = 'all', fDiff = 'all', q = '';

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.p) return s; } catch (e) {}
  return { p: {}, goal: 3 };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const rec = slug => S.p[slug] || (S.p[slug] = {});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const addDays = (n, from) => { const d = from ? new Date(from + 'T00:00:00') : new Date(); d.setDate(d.getDate() + n); return iso(d); };
const url = slug => `https://leetcode.com/problems/${slug}/`;
const DIFF = { E: 'Easy', M: 'Medium', H: 'Hard' };

// unique problems (a slug appearing in two topics counts once)
const BY_SLUG = {};
TOPICS.forEach(t => t.patterns.forEach(pt => pt.probs.forEach(([name, slug, d]) => { if (!BY_SLUG[slug]) BY_SLUG[slug] = { name, slug, d }; })));
const ALL = Object.values(BY_SLUG);
const solved = slug => !!(S.p[slug] && S.p[slug].solved);

function topicStats(t) {
  const seen = new Set(); let done = 0;
  t.patterns.forEach(pt => pt.probs.forEach(([, s]) => { if (!seen.has(s)) { seen.add(s); if (solved(s)) done++; } }));
  return { total: seen.size, done };
}
function solvedOn(day) { return ALL.filter(x => S.p[x.slug] && S.p[x.slug].date === day).length; }
function streak() {
  let n = 0, d = today();
  if (!solvedOn(d)) d = addDays(-1, d);       // today not done yet doesn't break streak
  while (solvedOn(d)) { n++; d = addDays(-1, d); }
  return n;
}

// ───────── actions ─────────
function toggleSolved(slug) {
  const r = rec(slug);
  r.solved = !r.solved;
  if (r.solved) { r.date = today(); r.stage = 0; r.due = addDays(REVIEW_INTERVALS[0]); }
  else { delete r.date; delete r.stage; delete r.due; }
  save(); render();
}
function revised(slug) {
  const r = rec(slug);
  r.stage = Math.min((r.stage || 0) + 1, REVIEW_INTERVALS.length);
  r.due = r.stage >= REVIEW_INTERVALS.length ? null : addDays(REVIEW_INTERVALS[r.stage]);
  save(); render();
}
function struggled(slug) { const r = rec(slug); r.retries = (r.retries || 0) + 1; r.stage = 0; r.due = addDays(1); save(); render(); }
function toggleNote(slug) { document.getElementById('note-' + slug).classList.toggle('open'); }
function saveNote(slug, v) { rec(slug).note = v; save(); const b = document.getElementById('nb-' + slug); if (b) b.textContent = v.trim() ? '📝 note' : '+ note'; }

// ───────── nav ─────────
function buildNav() {
  const item = (id, label, count, color) =>
    `<div class="nav-item ${page === id ? 'active' : ''}" onclick="go('${id}')"><span class="dot" style="background:${color}"></span><span class="t">${label}</span><span class="c">${count || ''}</span></div>`;
  const dueN = dueList().length;
  document.getElementById('sidebar').innerHTML =
    `<div class="logo"><b>DSA·PREP</b></div>
     <div class="nav-label">Overview</div>
     ${item('dashboard', 'Dashboard', '', 'var(--accent)')}
     ${item('revise', 'Revision queue', dueN ? dueN + ' due' : '', 'var(--amber)')}
     ${item('basics', 'Complexity basics', '', 'var(--blue)')}
     ${item('resources', 'Resources', '', '#facc15')}
     <div class="nav-label">Topics</div>
     ${TOPICS.map(t => { const s = topicStats(t); return item(t.id, t.title, `${s.done}/${s.total}`, t.color); }).join('')}
`;
}
function go(p) {
  page = p; fStatus = 'all'; fDiff = 'all'; q = '';
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0); render();
}

// ───────── pages ─────────
function render() {
  buildNav();
  const m = document.getElementById('main');
  if (page === 'dashboard') m.innerHTML = dashboard();
  else if (page === 'revise') m.innerHTML = revisePage();
  else if (page === 'resources') m.innerHTML = resourcesPage();
  else if (page === 'basics') m.innerHTML = basicsPage();
  else m.innerHTML = topicPage(TOPICS.find(t => t.id === page));
}

function dueList() {
  const t = today();
  return ALL.filter(x => { const r = S.p[x.slug]; return r && r.solved && r.due && r.due <= t; })
            .sort((a, b) => S.p[a.slug].due.localeCompare(S.p[b.slug].due));
}

function dashboard() {
  const total = ALL.length, done = ALL.filter(x => solved(x.slug)).length, td = solvedOn(today());
  const byD = d => { const l = ALL.filter(x => x.d === d); return `${l.filter(x => solved(x.slug)).length}/${l.length}`; };
  const goal = S.goal || 3;
  return `<h1>Dashboard</h1><div class="sub">consistency beats intensity</div>
  <div class="grid4">
    <div class="card"><div class="num" style="color:var(--green)">${done}</div><div class="lbl">Solved</div><div class="hint">of ${total} · ${Math.round(done / total * 100)}%</div></div>
    <div class="card"><div class="num" style="color:var(--blue)">${td}</div><div class="lbl">Today</div><div class="hint">goal ${goal}</div></div>
    <div class="card"><div class="num" style="color:var(--amber)">${streak()}</div><div class="lbl">Day streak</div><div class="hint">${streak() ? 'keep going' : 'start today'}</div></div>
    <div class="card"><div class="num" style="color:#a855f7">${dueList().length}</div><div class="lbl">Due for revision</div><div class="hint"><a href="#" style="color:var(--blue)" onclick="go('revise');return false">open queue →</a></div></div>
  </div>
  <div class="card">
    <div class="row"><div class="h3">Daily goal</div>
      <div class="pill">problems/day <input type="number" min="1" max="30" value="${goal}" onchange="S.goal=Math.max(1,+this.value||1);save();render()"></div></div>
    <div class="bar"><div style="width:${Math.min(100, td / goal * 100)}%"></div></div>
    <div class="hint">${td >= goal ? '🎯 daily goal reached' : `${goal - td} to go`}</div>
  </div>
  <div class="card"><div class="h3" style="margin-bottom:6px">By difficulty</div>
    <div class="hint">Easy ${byD('E')} &nbsp;·&nbsp; Medium ${byD('M')} &nbsp;·&nbsp; Hard ${byD('H')}</div></div>
  <div class="h3" style="margin-bottom:10px;color:var(--text2)">Topics</div>
  <div class="topics">${TOPICS.map(t => { const s = topicStats(t), p = Math.round(s.done / s.total * 100);
    return `<div class="tcard" style="--c:${t.color}" onclick="go('${t.id}')"><div class="n">${t.title}</div><div class="bar"><div style="width:${p}%"></div></div><div class="m">${s.done}/${s.total} · ${p}%</div></div>`; }).join('')}</div>`;
}

function toolbar() {
  const c = (cur, v, set, label) => `<button class="chip ${cur === v ? 'on' : ''}" onclick="${set}='${v}';render()">${label}</button>`;
  return `<div class="toolbar">
    ${c(fStatus, 'all', 'fStatus', 'All')}${c(fStatus, 'pending', 'fStatus', 'Pending')}${c(fStatus, 'done', 'fStatus', 'Solved')}<span class="sep"></span>
    ${c(fDiff, 'all', 'fDiff', 'Any')}${c(fDiff, 'E', 'fDiff', 'Easy')}${c(fDiff, 'M', 'fDiff', 'Medium')}${c(fDiff, 'H', 'fDiff', 'Hard')}
    <input class="search" id="search" placeholder="Search ( / )" value="${esc(q)}" oninput="onSearch(this.value)">
  </div>`;
}
function onSearch(v) { q = v.toLowerCase(); render(); const el = document.getElementById('search'); el.focus(); el.setSelectionRange(v.length, v.length); }

function visible([name, slug, d]) {
  if (fStatus === 'done' && !solved(slug)) return false;
  if (fStatus === 'pending' && solved(slug)) return false;
  if (fDiff !== 'all' && d !== fDiff) return false;
  if (q && !name.toLowerCase().includes(q)) return false;
  return true;
}

function probCard(slug, name, d) {
  const r = S.p[slug] || {}, has = (r.note || '').trim();
  const due = r.solved && r.due ? (r.due <= today() ? '<span class="pill" style="color:var(--amber)">revise due</span>' : `<span class="pill">next review ${r.due}</span>`) : '';
  return `<div class="prob ${r.solved ? 'solved' : ''}">
    <div class="prow">
      <button class="cb ${r.solved ? 'on' : ''}" onclick="toggleSolved('${slug}')" title="Mark solved">${r.solved ? '✓' : ''}</button>
      <div class="pbody"><div class="pname">${esc(name)}</div><a class="plink" href="${url(slug)}" target="_blank" rel="noopener">↗ LeetCode</a> ${due}</div>
      <span class="diff ${d}">${DIFF[d]}</span>
      <div class="acts">
        ${r.solved ? `<button class="mini" onclick="revised('${slug}')" title="I revised it, push next review out">revised ✓</button>` : ''}
        <button class="mini warn" onclick="struggled('${slug}')" title="Struggled — retry soon">retry ${r.retries || 0} +</button>
        <button class="mini" id="nb-${slug}" onclick="toggleNote('${slug}')">${has ? '📝 note' : '+ note'}</button>
      </div>
    </div>
    <div class="note" id="note-${slug}"><textarea placeholder="Approach, pattern, time/space complexity, pitfalls..." oninput="saveNote('${slug}',this.value)">${esc(r.note || '')}</textarea></div>
  </div>`;
}

function topicPage(t) {
  const s = topicStats(t);
  let html = `<h1 style="color:${t.color}">${t.title}</h1><div class="sub">${s.done} of ${s.total} solved · ${Math.round(s.done / s.total * 100)}%</div><div class="card" style="margin-top:-.5rem"><div class="hint" style="margin:0;font-family:var(--sans);font-size:13px;line-height:1.6">${t.intro}</div>
    <div style="margin-top:10px">${t.links.map(([l, u]) => `<a class="plink" style="margin-right:14px" href="${u}" target="_blank" rel="noopener">↗ ${l}</a>`).join('')}</div></div>${toolbar()}`;
  let any = false;
  t.patterns.forEach(pt => {
    const v = pt.probs.filter(visible); if (!v.length) return; any = true;
    html += `<div class="pattern">${pt.name}</div>` + v.map(([n, sl, d]) => probCard(sl, n, d)).join('');
  });
  return html + (any ? '' : '<div class="empty">No problems match your filters.</div>');
}


function resourcesPage() {
  return `<h1>Resources</h1><div class="sub">free places to learn the theory and see solutions</div>` +
    RESOURCES.map(g => `<div class="pattern">${g.group}</div>` + g.items.map(([n, u, d]) =>
      `<div class="prob"><div class="prow"><div class="pbody"><div class="pname">${n}</div><div class="hint" style="margin:2px 0 4px;font-family:var(--sans)">${d}</div><a class="plink" href="${u}" target="_blank" rel="noopener">↗ ${u.replace(/^https?:\/\//, '')}</a></div></div></div>`).join('')).join('');
}

function basicsPage() {
  const rows = [
    ['O(1)', 'Constant', 'Same work no matter the input size', 'Array index, hash map lookup'],
    ['O(log n)', 'Logarithmic', 'Halve the problem each step', 'Binary search'],
    ['O(n)', 'Linear', 'Look at each item once', 'One loop over an array'],
    ['O(n log n)', 'Linearithmic', 'Sorting-level cost', 'Merge sort, sorting before a scan'],
    ['O(n²)', 'Quadratic', 'Loop inside a loop', 'Brute-force pairs'],
    ['O(2ⁿ)', 'Exponential', 'Try every combination', 'Subsets, naive recursion'],
  ];
  return `<h1>Complexity basics</h1><div class="sub">how to judge whether your solution is fast enough</div>
  <div class="card"><div class="h3" style="margin-bottom:8px">What is Big-O?</div>
    <div class="hint" style="font-family:var(--sans);font-size:13px;line-height:1.7">It describes how the work grows as the input size <b>n</b> grows, ignoring constants. Time complexity = how many steps. Space complexity = how much extra memory. Interviewers always ask for both.</div></div>
  <div class="card"><table style="width:100%;border-collapse:collapse;font-size:13px">
    <tr style="color:var(--text3);text-align:left"><th style="padding:6px">Big-O</th><th>Name</th><th>Meaning</th><th>Example</th></tr>
    ${rows.map(r => `<tr style="border-top:1px solid var(--border)"><td style="padding:8px 6px;font-family:var(--mono);color:var(--accent)">${r[0]}</td><td>${r[1]}</td><td style="color:var(--text2)">${r[2]}</td><td style="color:var(--text2)">${r[3]}</td></tr>`).join('')}
  </table></div>
  <div class="card"><div class="h3" style="margin-bottom:8px">Rules of thumb</div>
    <div class="hint" style="font-family:var(--sans);font-size:13px;line-height:1.9">
    • One loop → O(n). Nested loops → O(n²).<br>• Drop constants and small terms: O(2n + 5) is just O(n).<br>
    • Input up to ~10⁵ → aim for O(n) or O(n log n). Up to ~10³ → O(n²) is fine. Up to ~20 → exponential is fine.<br>
    • Recursion: work per call × number of calls (memoization cuts the calls).<br>
    • How to approach any problem: 1) restate it, 2) write the brute force and its complexity, 3) ask "what am I repeating?", 4) fix it with a map, sorting, two pointers or DP, 5) test on small examples.</div></div>
  <div class="card"><a class="plink" href="https://www.bigocheatsheet.com/" target="_blank" rel="noopener">↗ Big-O Cheat Sheet</a> &nbsp; <a class="plink" href="https://visualgo.net/en" target="_blank" rel="noopener">↗ VisuAlgo animations</a></div>`;
}

function revisePage() {
  const l = dueList();
  return `<h1>Revision queue</h1><div class="sub">spaced repetition: ${REVIEW_INTERVALS.join(' → ')} days after you solve</div>` +
    (l.length ? l.map(x => probCard(x.slug, x.name, x.d)).join('') : '<div class="empty">Nothing due. Solve more problems or come back tomorrow.</div>');
}

document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    const el = document.getElementById('search'); if (el) { e.preventDefault(); el.focus(); }
  }
});
render();
</script>
</body>
</html>
